<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="مسمكة الفوز: سمك طازج ومجفف في موريتانيا. اطلب عبر واتساب.">
<title>مسمكة الفوز 🏆🐟</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f9fb;--card:#fff;--tx:#0b2a3a;--mu:#5c7585;--pr:#0a7ea4;--ac:#e8913a;--bd:#d8e6ee;--wa:#25d366}
@media(prefers-color-scheme:dark){:root{--bg:#08181f;--card:#10262f;--tx:#e6f2f7;--mu:#8fa9b6;--pr:#3bb5de;--bd:#1d3a46}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
button,input,select{font:inherit;color:inherit}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(160deg,#0a7ea4,#054a63);color:#fff;padding:14px}
header h1{margin:0;font-size:20px}header .r{display:flex;gap:6px;flex-wrap:wrap}
.hero{text-align:center;padding:18px;color:var(--mu)}
.btn{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;background:var(--pr);color:#fff;font-weight:700;text-decoration:none;display:inline-block}
.btn.sec{background:var(--bd);color:var(--tx)}.btn.red{background:#d64545}.btn.wa{background:var(--wa);color:#04361a}.btn[disabled]{background:var(--mu)}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 90px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer;white-space:nowrap}.tabs .on{background:var(--pr);color:#fff}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:160px;background:var(--bd);position:relative;display:flex;align-items:center;justify-content:center;font-size:56px}.pic img{width:100%;height:100%;object-fit:cover}
.hb{position:absolute;top:8px;left:8px;border:0;background:rgba(255,255,255,.92);border-radius:50%;width:34px;height:34px;font-size:18px;color:#d64545;cursor:pointer}
.tag{position:absolute;top:8px;right:8px;font-size:12px;padding:2px 10px;border-radius:12px;color:#fff;background:var(--pr)}.tag.d{background:var(--ac)}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.info h3{margin:0;font-size:17px}.info p{margin:0;color:var(--mu);font-size:13px;flex:1}
.price{font-weight:700;color:var(--pr)}
.banner{background:var(--card);border:1px dashed var(--ac);border-radius:14px;padding:10px;text-align:center;margin:10px 0}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;overflow-y:auto}
#md .box{background:var(--card);max-width:480px;margin:30px auto;border-radius:16px;padding:16px;position:relative}
.x{position:absolute;top:8px;left:12px;border:0;background:none;font-size:24px;cursor:pointer}
.f{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.fab{position:fixed;bottom:16px;left:14px;z-index:20}.fab a{box-shadow:0 4px 14px rgba(0,0,0,.3);border-radius:30px;padding:12px 18px}
#toast{position:fixed;bottom:80px;right:50%;transform:translateX(50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:40}
</style>
</head>
<body>
<header><h1>🏆🐟 مسمكة الفوز</h1><div class="r" id="head"></div></header>
<div class="hero">سمك طازج ومجفف بجودة عالية — اطلب الآن عبر واتساب</div>
<div class="wrap">
<div id="draw"></div>
<div class="tabs" id="tabs"></div>
<input id="sq" placeholder="🔎 ابحث عن سمك...">
<div class="grid" id="grid"></div>
</div>
<div class="fab"><a class="btn wa" id="wafab" target="_blank" rel="noopener">💬 واتساب</a></div>
<div id="md"><div class="box"><button class="x" data-act="close" aria-label="إغلاق">×</button><div id="mc"></div></div></div>
<div id="toast"></div>
<script>
// ===== إعدادات: غيّر رقم واتساب المالك هنا (222 + 8 أرقام) =====
const OWNER_WA='22200000000';
const SB_URL='https://jfllrctmblqerxiiraob.supabase.co';
const SB_KEY='sb_publishable_E6J8jxGud7QMgm2qXcpFPw_ZAuBz_u8';
// ================================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toLocaleString('ar-EG',{maximumFractionDigits:2});
const step=u=>u==='كغ'?0.5:1;
const imgUrl=p=>p.image_path?`${SB_URL}/storage/v1/object/public/products/${encodeURIComponent(p.image_path)}`:'';
let S={user:null,admin:false,products:[],favs:new Set(),stars:0,tab:'all',q:'',cart:{},phone:''};
$('#wafab').href='https://wa.me/'+OWNER_WA;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function modal(h){$('#mc').innerHTML=h;$('#md').style.display='block'}
function closeModal(){$('#md').style.display='none'}
function say(m){const e=$('#msg');if(e)e.textContent=m;else toast(m)}

function renderHead(){
 const n=Object.keys(S.cart).length;
 $('#head').innerHTML=(S.user?`<span class="btn sec">⭐ ${fmt(S.stars)}</span>`+(S.admin?'<button class="btn sec" data-act="admin">⚙ المالك</button>':'')+'<button class="btn sec" data-act="logout">خروج</button>':'<button class="btn sec" data-act="login">دخول</button>')+`<button class="btn" data-act="cart">🛒 (${n})</button>`;
}
function renderTabs(){
 $('#tabs').innerHTML=[['all','الكل'],['fresh','🐟 طازج'],['dried','☀ مجفف'],['fav','❤ المفضلة']].map(t=>`<button class="${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
}
function renderGrid(){
 const L=S.products.filter(p=>(S.tab==='all'||(S.tab==='fav'?S.favs.has(p.id):p.cat===S.tab))&&p.name.includes(S.q));
 $('#grid').innerHTML=L.map(p=>`<div class="card"><div class="pic">${p.image_path?`<img src="${imgUrl(p)}" alt="${esc(p.name)}" loading="lazy">`:'🐟'}
 <button class="hb" data-fav="${p.id}" aria-label="مفضلة">${S.favs.has(p.id)?'♥':'♡'}</button><span class="tag ${p.cat==='dried'?'d':''}">${p.cat==='dried'?'مجفف':'طازج'}</span></div>
 <div class="info"><h3>${esc(p.name)}</h3><p>${esc(p.descr||'')}</p><div class="price">${fmt(p.price)} أوقية / ${esc(p.unit)}</div>
 <button class="btn" data-add="${p.id}" ${p.in_stock?'':'disabled'}>${p.in_stock?'🛒 أضف للسلة':'نفد المخزون'}</button></div></div>`).join('')||'<p>لا توجد منتجات.</p>';
}
async function loadProducts(){const{data,error}=await sb.from('products').select('*').order('name');S.products=error?[]:data;renderGrid()}
async function loadDraw(){const{data}=await sb.from('draws').select('month,masked_phone').order('created_at',{ascending:false}).limit(1);
 $('#draw').innerHTML=data&&data[0]?`<div class="banner">🎁 فائز سحب ${esc(data[0].month.slice(0,7))}: <b dir="ltr">${esc(data[0].masked_phone)}</b></div>`:'<div class="banner">⭐ نجمة لكل شراء، وسحب شهري على هدية!</div>'}
async function loadUser(){
 const{data:{session}}=await sb.auth.getSession();S.user=session?session.user:null;S.favs=new Set();S.stars=0;S.admin=false;
 if(S.user){
  const[f,st,ad]=await Promise.all([sb.from('favorites').select('product_id'),sb.from('stars').select('id',{count:'exact',head:true}).eq('user_id',S.user.id),sb.rpc('is_admin')]);
  S.favs=new Set((f.data||[]).map(x=>x.product_id));S.stars=st.count||0;S.admin=ad.data===true;
 }
 renderHead();renderGrid();
}
sb.auth.onAuthStateChange(()=>{setTimeout(loadUser,0)});

// ===== الدخول برقم موريتاني =====
function normPhone(v){let n=String(v).replace(/\D/g,'');if(/^[234]\d{7}$/.test(n))n='222'+n;return /^222[234]\d{7}$/.test(n)?'+'+n:null}
function openLogin(){modal('<h3>تسجيل الدخول</h3><p>أدخل رقمك الموريتاني (8 أرقام)</p><input id="ph" inputmode="numeric" placeholder="22123456" dir="ltr"><button class="btn" data-act="sendotp">إرسال الرمز</button><p id="msg"></p>')}
async function sendOtp(){const p=normPhone($('#ph').value);if(!p)return say('رقم غير صحيح');
 const{error}=await sb.auth.signInWithOtp({phone:p});if(error)return say('تعذر إرسال الرمز، حاول لاحقاً');
 S.phone=p;modal('<h3>أدخل الرمز</h3><input id="otp" inputmode="numeric" maxlength="6" dir="ltr"><button class="btn" data-act="verify">تأكيد</button><p id="msg"></p>')}
async function verify(){const t=$('#otp').value.trim();if(!/^\d{6}$/.test(t))return say('الرمز 6 أرقام');
 const{error}=await sb.auth.verifyOtp({phone:S.phone,token:t,type:'sms'});if(error)return say('الرمز غير صحيح أو منتهٍ');closeModal();toast('تم تسجيل الدخول ✅')}

// ===== المفضلة والسلة =====
async function toggleFav(id){if(!S.user)return openLogin();
 if(S.favs.has(id)){await sb.from('favorites').delete().eq('product_id',id).eq('user_id',S.user.id);S.favs.delete(id)}
 else{const{error}=await sb.from('favorites').insert({product_id:id});if(!error)S.favs.add(id)}renderGrid()}
function addCart(id){const p=S.products.find(x=>x.id===id);S.cart[id]=Math.min(50,(S.cart[id]||0)+step(p.unit));renderHead();toast('أُضيف للسلة')}
function openCart(){
 const it=Object.keys(S.cart).map(id=>S.products.find(p=>p.id===id)).filter(Boolean);
 const tot=it.reduce((a,p)=>a+p.price*S.cart[p.id],0);
 modal('<h3>🛒 السلة</h3>'+(it.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><br><small>${fmt(p.price*S.cart[p.id])} أوقية</small></div><div><button class="btn sec" data-q="${p.id}" data-d="1">+</button> ${fmt(S.cart[p.id])} ${esc(p.unit)} <button class="btn sec" data-q="${p.id}" data-d="-1">−</button></div></div>`).join('')||'<p>السلة فارغة.</p>')+
 (it.length?`<h4>الإجمالي التقريبي: ${fmt(tot)} أوقية</h4><input id="nm" placeholder="الاسم" maxlength="60"><input id="ad" placeholder="العنوان / الحي" maxlength="120"><button class="btn wa" style="width:100%" data-act="checkout">${S.user?'تأكيد الطلب':'سجّل الدخول لإتمام الطلب'}</button><p id="msg"></p>`:''));
}
async function checkout(){
 if(!S.user)return openLogin();
 const items=Object.entries(S.cart).map(([product_id,qty])=>({product_id,qty}));
 const addr=(($('#nm').value.trim())+' - '+($('#ad').value.trim())).slice(0,200);
 const{data:id,error}=await sb.rpc('create_order',{p_items:items,p_address:addr});
 if(error)return say('تعذر إنشاء الطلب. تأكد أن المنتجات متوفرة.');
 const{data:o}=await sb.from('orders').select('total').eq('id',id).single();
 const lines=items.map(i=>{const p=S.products.find(x=>x.id===i.product_id);return `• ${p.name}: ${fmt(i.qty)} ${p.unit}`}).join('\n');
 const msg=`السلام عليكم، طلب رقم ${id.slice(0,8)}\n${lines}\nالإجمالي: ${fmt(o?o.total:0)} أوقية\n${addr}`;
 S.cart={};renderHead();
 modal(`<h3>تم استلام طلبك ✅</h3><p>رقم الطلب: <b>${esc(id.slice(0,8))}</b></p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${OWNER_WA}?text=${encodeURIComponent(msg)}">أرسل الطلب عبر واتساب</a>`);
}

// ===== لوحة المالك (الصلاحيات مفروضة من قاعدة البيانات) =====
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.8)};im.onerror=no;im.src=u})}
async function openAdmin(){
 const{data:ords}=await sb.from('orders').select('id,total,status,address').order('created_at',{ascending:false}).limit(20);
 const opt=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('');
 modal(`<h3>⚙ لوحة المالك</h3><button class="btn" data-act="newp">+ منتج جديد</button> <button class="btn sec" data-act="draw">🎁 سحب هذا الشهر</button><p id="msg"></p>
 <h4>الطلبات</h4>${(ords||[]).map(o=>`<div class="f"><b>#${esc(o.id.slice(0,8))}</b> — ${fmt(o.total)} أوقية — ${esc(o.status)}<br><small>${esc(o.address||'')}</small><div><button class="btn" data-o="deliver" data-id="${o.id}">تم + ⭐</button> <button class="btn sec" data-o="prep" data-id="${o.id}">تحضير</button> <button class="btn red" data-o="cancel" data-id="${o.id}">إلغاء</button></div></div>`).join('')||'<p>لا طلبات.</p>'}
 <h4>المنتجات</h4>${S.products.map(p=>`<div class="f"><input id="n_${p.id}" value="${esc(p.name)}" maxlength="80"><input id="pr_${p.id}" type="number" min="0" value="${p.price}">
 <select id="u_${p.id}">${opt([['كغ','كغ'],['كيس','كيس'],['قطعة','قطعة'],['علبة','علبة']],p.unit)}</select>
 <select id="c_${p.id}">${opt([['fresh','طازج'],['dried','مجفف']],p.cat)}</select>
 <input id="d_${p.id}" value="${esc(p.descr||'')}" maxlength="300" placeholder="الوصف">
 <input id="i_${p.id}" type="file" accept="image/*"><label><input type="checkbox" id="s_${p.id}" style="width:auto" ${p.in_stock?'checked':''}> متوفر</label><br>
 <button class="btn" data-act="savep" data-id="${p.id}">حفظ</button> <button class="btn red" data-act="delp" data-id="${p.id}">حذف</button></div>`).join('')}`);
}
async function saveP(id){const g=x=>$('#'+x+'_'+id);
 const upd={name:g('n').value.trim().slice(0,80),price:Math.min(1e6,Math.max(0,+g('pr').value||0)),unit:g('u').value,cat:g('c').value,descr:g('d').value.slice(0,300),in_stock:g('s').checked};
 const f=g('i').files[0];
 if(f){try{const b=await shrink(f),path=`${id}-${Date.now()}.jpg`;const{error}=await sb.storage.from('products').upload(path,b,{contentType:'image/jpeg'});if(error)return say('فشل رفع الصورة');upd.image_path=path}catch(e){return say('ملف الصورة غير صالح')}}
 const{error}=await sb.from('products').update(upd).eq('id',id);if(error)return say('تعذر الحفظ');
 await loadProducts();toast('تم الحفظ ✅')}
async function orderAct(id,a){
 if(a==='deliver'){const{error}=await sb.rpc('award_star',{p_order:id});if(error)return say('تعذر المنح')}
 else await sb.from('orders').update({status:a==='prep'?'preparing':'cancelled'}).eq('id',id);
 openAdmin()}
async function draw(){const{data,error}=await sb.rpc('draw_winner',{p_month:new Date().toISOString().slice(0,8)+'01'});
 if(error)return say('تم السحب مسبقاً هذا الشهر أو لا توجد نجوم');say('🎉 الفائز: '+data);loadDraw()}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
 if(d.tab){S.tab=d.tab;renderTabs();renderGrid()}
 else if(d.fav)toggleFav(d.fav);
 else if(d.add)addCart(d.add);
 else if(d.q){const p=S.products.find(x=>x.id===d.q);S.cart[d.q]=Math.min(50,(S.cart[d.q]||0)+d.d*step(p.unit));if(S.cart[d.q]<=0)delete S.cart[d.q];renderHead();openCart()}
 else if(d.o)orderAct(d.id,d.o);
 else switch(d.act){
  case'close':closeModal();break;case'login':openLogin();break;case'sendotp':sendOtp();break;case'verify':verify();break;
  case'logout':await sb.auth.signOut();toast('تم الخروج');break;case'cart':openCart();break;case'checkout':checkout();break;
  case'admin':openAdmin();break;case'savep':saveP(d.id);break;case'draw':draw();break;
  case'newp':{const{error}=await sb.from('products').insert({name:'منتج جديد',cat:'fresh',price:0,unit:'كغ'});if(error)return say('غير مسموح');await loadProducts();openAdmin();break}
  case'delp':if(confirm('حذف المنتج؟')){await sb.from('products').delete().eq('id',d.id);await loadProducts();openAdmin()}break}
});
$('#sq').oninput=e=>{S.q=e.target.value;renderGrid()};
renderHead();renderTabs();loadProducts();loadDraw();loadUser();
</script>
</body>
</html>
